name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      # 1. Проверка кода
      - name: Run Lint
        run: ./gradlew lintDebug

      # 2. Запуск Unit тестов
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      # 3. Сборка Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # 4. Сборка Release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Подписание релизного APK
            # 5. Подписание релизного APK (финальный рабочий вариант)
      - name: Sign Release APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          echo "$SIGNING_KEY" | base64 -d > $RUNNER_TEMP/release.keystore
          
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          echo "Using build-tools version: $BUILD_TOOLS"
          
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          
          # 1. Выравниваем
          "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$SIGNED_APK"
          
          # 2. Подписываем (команду verify убрали, она ломает сборку на новых билд-тулсах)
          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$SIGNED_APK"
            
          echo "✅ APK signed successfully: $SIGNED_APK"
