name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate Keystore and Sign APK
        run: |
          set -e
          
          keytool -genkeypair -v -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -alias my-key -keystore $RUNNER_TEMP/release.keystore -dname "CN=ClipSync, OU=Dev, O=ClipSync, L=City, ST=State, C=RU"
          
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="app/build/outputs/apk/release/app-release-signed.apk"
          
          echo "--- Проверка файлов ---"
          ls -l "$RUNNER_TEMP/release.keystore"
          ls -l "$UNSIGNED_APK"
          echo "-----------------------"
          
          "$APKSIGNER" sign --ks="$RUNNER_TEMP/release.keystore" --ks-pass=pass:android123 --ks-key-alias=my-key --key-pass=pass:android123 --out="$SIGNED_APK" "$UNSIGNED_APK"
          
          cp "$RUNNER_TEMP/release.keystore" app/build/outputs/apk/release/release.keystore
          echo "✅ APK подписан!"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: |
            app/build/outputs/apk/release/app-release-signed.apk
            app/build/outputs/apk/release/release.keystore
          retention-days: 30
